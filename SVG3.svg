<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://w3.org" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style type="text/css">
      <![CDATA[
      /* Force embedded browser frame to fill the SVG wrapper */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f0f4f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      foreignObject {
        overflow: visible;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }
      .welcome {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        max-width: 600px;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        color: #1a202c;
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 28px;
      }
      #game input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
        margin-bottom: 20px;
      }
      .game-modes {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
      }
      .game-modes-column {
        flex: 1;
        background: #f7fafc;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #edf2f7;
      }
      .game-modes-column p {
        margin-top: 0;
        margin-bottom: 10px;
        color: #4a5568;
      }
      .game-modes-column div {
        margin-bottom: 8px;
      }
      .game-modes-column label {
        display: block;
        cursor: pointer;
        color: #4a5568;
        font-size: 14px;
      }
      .action {
        text-align: center;
        margin-bottom: 25px;
      }
      .btn {
        background: #3182ce;
        color: white;
        border: none;
        padding: 12px 40px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #2b6cb0;
      }
      .controls-map {
        display: flex;
        gap: 20px;
        border-top: 1px solid #edf2f7;
        padding-top: 20px;
        font-size: 13px;
        color: #718096;
      }
      .controls-map div {
        flex: 1;
      }
      .controls-map p {
        margin-top: 0;
        color: #4a5568;
      }
      .controls-map ul {
        padding-left: 18px;
        margin: 0;
      }
      .controls-map li {
        margin-bottom: 6px;
      }
      kbd {
        background: #edf2f7;
        border: 1px solid #cbd5e0;
        border-radius: 3px;
        padding: 1px 5px;
        margin: 0 2px;
        font-family: monospace;
        font-size: 11px;
        color: #2d3748;
      }
      .ui, #canvas, #canvas1, #canvas2 {
        display: none; /* Hidden until main engine initializes */
      }
      ]]>
    </style>
  </defs>

  <!-- Background vector fallback -->
  <rect width="100%" height="100%" fill="#f0f4f8" />
  
  <!-- Embedded XHTML Frame -->
  <foreignObject x="0" y="0" width="1000" height="700">
    <html xmlns="http://w3.org">
      <head>
        <meta charset="UTF-8" />
        <title>Bit Planes</title>
      </head>
      <body>
        <main>
          <section class="welcome">
            <h1>Bit Planes</h1>
            <form id="game">
              <label>
                <input type="text" name="nickname" placeholder="Enter Nickname..." />
              </label>
              <div class="game-modes">
                <div class="game-modes-column">
                  <p><strong>Game modes:</strong></p>
                  <div>
                    <label title="Everyone against everyone."><input type="radio" name="mode" value="death-match" checked="checked" /> Death match</label>
                  </div>
                  <div>
                    <label title="Fight between teams."><input type="radio" name="mode" value="teams" /> Teams</label>
                  </div>
                  <div>
                    <label title="One on one duel."><input type="radio" name="mode" value="duel" /> Duel</label>
                  </div>
                  <div>
                    <label title="Survive with a waves of enemies."><input type="radio" name="mode" value="survival" /> Survival</label>
                  </div>
                </div>
                <div class="game-modes-column">
                  <p><strong>Fun modes:</strong></p>
                  <div>
                    <label title="Two big teams against each other."><input type="radio" name="mode" value="swarm" /> Swarm</label>
                  </div>
                  <div>
                    <label title="Total domination."><input type="radio" name="mode" value="domination" /> Domination</label>
                  </div>
                  <div>
                    <label title="Revenge of cows."><input type="radio" name="mode" value="revenge" /> Revenge</label>
                  </div>
                </div>
              </div>
              <div class="action">
                <button type="button" class="btn" onclick="alert('To execute active gameplay scripts directly out of an SVG file, it must be loaded through a web URL/server due to browser engine sandboxing.')">‣ Start Game</button>
              </div>
            </form>
            <div class="controls-map">
              <div>
                <p><strong>Controls:</strong></p>
                <ul>
                  <li>Arrows <kbd>↑</kbd><kbd>↓</kbd> — thrust</li>
                  <li>Arrows <kbd>←</kbd><kbd>→</kbd> — elevators</li>
                  <li><kbd>Space</kbd> — fire gun</li>
                </ul>
              </div>
              <div>
                <p><strong>Split screen:</strong></p>
                <ul>
                  <li>P1 — Arrows + <kbd>,</kbd> <kbd>.</kbd></li>
                  <li>P2 — <kbd>W</kbd><kbd>S</kbd><kbd>A</kbd><kbd>D</kbd> + <kbd>V</kbd> <kbd>B</kbd></li>
                </ul>
              </div>
            </div>
          </section>
        </main>
      </body>
    </html>
  </foreignObject>
</svg>

